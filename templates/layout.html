<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link href="/static/styles.css" rel="stylesheet">
        <title>Job Tracker: {% block title %}{% endblock %}</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Job Tracker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/add' %}active{% endif %}" href="/add">Add</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/followups' %}active{% endif %}" href="/followups">Follow-ups</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.path == '/stats' %}active{% endif %}" href="/stats">Stats</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-4">
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endwith %}

            {% block main %}{% endblock %}
        </main>
    </body>
</html>
