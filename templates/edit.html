{% extends "layout.html" %}

{% block title %}
    Edit Application
{% endblock %}

{% block main %}
    <h1 class="mb-4">Edit Application</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="/edit/{{ application.id }}" method="post" class="add-form">
        <div class="mb-3">
            <label for="company" class="form-label">Company *</label>
            <input type="text" id="company" name="company" class="form-control" value="{{ application.company }}" autocomplete="off" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role *</label>
            <input type="text" id="role" name="role" class="form-control" value="{{ application.role }}" autocomplete="off" required>
        </div>
        <div class="mb-3">
            <label for="link" class="form-label">Job link</label>
            <input type="url" id="link" name="link" class="form-control" value="{{ application.link or '' }}" autocomplete="off">
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" id="location" name="location" class="form-control" value="{{ application.location or '' }}" autocomplete="off">
        </div>
        <div class="mb-3">
            <label for="date_applied" class="form-label">Date applied *</label>
            <input type="date" id="date_applied" name="date_applied" class="form-control" value="{{ application.date_applied }}" required>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select">
                {% for status in statuses %}
                    <option value="{{ status }}" {% if status == application.status %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3">{{ application.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save changes</button>
    </form>

    <form action="/delete/{{ application.id }}" method="post" class="mt-3" onsubmit="return confirm('Delete this application?');">
        <button type="submit" class="btn btn-outline-danger">Delete</button>
    </form>
{% endblock %}
